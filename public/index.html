<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YT Altyazı</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="#/" class="brand"><span class="logo">🎬</span><span>YT <strong>Altyazı</strong></span></a>
      <button id="drawerBtn" class="btn btn-ghost hidden" aria-expanded="false" data-i18n="nav.videos" data-i18n-title="nav.videosTitle"></button>
    </div>
    <div class="actions">
      <a id="favBtn" href="#/favorites" class="btn btn-ghost" data-i18n-title="nav.favoritesTitle"><span data-i18n="nav.favorites"></span><span id="favBadge" class="nav-badge hidden"></span></a>
      <button id="settingsBtn" class="btn btn-ghost btn-icon" data-i18n-title="nav.settings" data-i18n-aria="nav.settings">⚙</button>
      <button id="newBtn" class="btn btn-primary" data-i18n="nav.new"></button>
    </div>
  </header>
  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>

  <main>
    <section id="empty" class="empty hidden">
      <div class="empty-card">
        <div class="empty-emoji">🎞️</div>
        <h1 data-i18n="empty.title"></h1>
        <p data-i18n-html="empty.text.html"></p>
        <button id="emptyNewBtn" class="btn btn-primary btn-lg" data-i18n="nav.new"></button>
      </div>
    </section>

    <section id="home" class="home hidden">
      <div class="home-head">
        <div>
          <h1 data-i18n="home.title"></h1>
          <p id="homeStats" class="muted"></p>
        </div>
        <input id="searchInput" class="input search" type="search" data-i18n-placeholder="home.search" spellcheck="false" />
      </div>
      <div id="videoGrid" class="video-grid"></div>
    </section>

    <section id="favoritesView" class="home page hidden"></section>
    <section id="reviewView" class="home page hidden"></section>
    <section id="studyView" class="home page hidden"></section>

    <section id="workspace" class="workspace hidden">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2 data-i18n="home.title"></h2>
          <span id="projCount" class="badge">0</span>
        </div>
        <a href="#/" id="drawerHome" class="drawer-home" data-i18n="home.all"></a>
        <ul id="projectList" class="project-list"></ul>
      </aside>

      <div class="pane video-pane">
        <div class="toolbar video-toolbar" role="toolbar" data-i18n-aria="video.toolbar">
          <div class="tb-group">
            <span id="capLabel" class="tb-label" data-i18n="cap.label"></span>
            <div id="capSeg" class="seg" role="group" aria-labelledby="capLabel" data-i18n-title="cap.title">
              <button data-cap="off" data-i18n="cap.off"></button>
              <button data-cap="en" data-i18n="cap.en"></button>
              <button data-cap="tr" data-i18n="cap.tr"></button>
              <button data-cap="both" data-i18n="cap.both"></button>
            </div>
          </div>
          <div class="tb-group">
            <span id="speedLabel" class="tb-label" data-i18n="video.speedLabel"></span>
            <div class="seg speed-seg" role="group" aria-labelledby="speedLabel">
              <button data-rate="0.75">0.75×</button>
              <button data-rate="1">1×</button>
              <button data-rate="1.25">1.25×</button>
              <button data-rate="1.5">1.5×</button>
            </div>
          </div>
          <div class="tb-group tb-actions">
            <button id="panelShowBtn" class="btn btn-sm panel-show-btn" data-i18n-title="cap.panelShowTitle"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg><span data-i18n="cap.panelShow"></span></button>
            <button id="hideVideoBtn" class="btn btn-sm" data-i18n-title="video.hideTitle"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 8.5 4 9.5 6a14 14 0 0 1-2.6 3.4"/><path d="M6.5 7.7C4.4 9.2 3 11.3 2.5 12c1 2 4.5 6 9.5 6 1.5 0 2.8-.4 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg><span data-i18n="video.hide"></span></button>
            <button id="deleteBtn" class="btn btn-sm btn-quiet btn-quiet-danger" data-i18n-title="video.deleteTitle"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span data-i18n="video.delete"></span></button>
          </div>
        </div>
        <div id="videoFrame" class="video-frame">
          <video id="video" controls controlsList="nofullscreen" playsinline preload="metadata"></video>
          <div id="videoClick" class="video-click"></div>
          <div id="capOverlay" class="cap-overlay" hidden><div id="capEn" class="cap-en"></div><div id="capTr" class="cap-tr"></div></div>
          <button id="fsBtn" class="fs-btn" data-i18n-title="cap.fullscreen" data-i18n-aria="cap.fullscreen">⛶</button>
        </div>
        <div class="video-meta">
          <h2 id="videoTitle">—</h2>
          <p id="videoStats"></p>
        </div>
        <details class="kbd-help">
          <summary><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span data-i18n="hint.title"></span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></summary>
          <div class="kbd-grid">
            <div><span class="keys"><kbd>Space</kbd><kbd>K</kbd></span><span data-i18n="hint.space"></span></div>
            <div><span class="keys"><kbd>←</kbd><kbd>→</kbd></span><span data-i18n="hint.arrows"></span></div>
            <div><span class="keys"><kbd>J</kbd><kbd>L</kbd></span><span data-i18n="hint.jl"></span></div>
            <div><span class="keys"><kbd>↑</kbd><kbd>↓</kbd></span><span data-i18n="hint.updown"></span></div>
            <div><span class="keys"><kbd>C</kbd></span><span data-i18n="hint.c"></span></div>
            <div><span class="keys"><kbd>V</kbd></span><span data-i18n="hint.v"></span></div>
            <div><span class="keys"><kbd>P</kbd></span><span data-i18n="hint.p"></span></div>
            <div><span class="keys"><kbd>Shift</kbd></span><span data-i18n="hint.sel"></span></div>
            <div><span class="keys"><kbd>R</kbd></span><span data-i18n="hint.r"></span></div>
            <div><span class="keys"><kbd>F</kbd></span><span data-i18n="hint.f"></span></div>
            <div><span class="keys"><kbd>M</kbd></span><span data-i18n="hint.m"></span></div>
            <div><span class="keys"><kbd>0–9</kbd></span><span data-i18n="hint.digits"></span></div>
            <div><span class="keys"><kbd>Shift</kbd><kbd>,</kbd><kbd>.</kbd></span><span data-i18n="hint.speedkeys"></span></div>
            <div><span class="keys"><kbd>,</kbd><kbd>.</kbd></span><span data-i18n="hint.frames"></span></div>
            <div><span class="keys"><kbd>Home</kbd><kbd>End</kbd></span><span data-i18n="hint.startend"></span></div>
          </div>
          <p class="kbd-note"><span data-i18n="hint.pic"></span> · <span data-i18n="hint.click"></span></p>
        </details>
      </div>

      <div class="pane subs-pane">
        <div class="subs-head">
          <h2 data-i18n="subs.title"></h2>
          <span id="subCount" class="badge"></span>
          <span class="head-spacer"></span>
          <button id="panelBtn" class="btn btn-sm" data-i18n-title="cap.panelTitle"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg><span data-i18n="cap.panelHide"></span></button>
        </div>
        <div id="miniPlayer" class="mini-player">
          <div class="mp-row">
            <strong id="mpTitle" class="mp-title"></strong>
            <button id="mpShowVideo" class="btn btn-sm" data-i18n-title="mini.showVideoTitle"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg><span data-i18n="mini.showVideo"></span></button>
          </div>
          <div class="mp-row">
            <button id="mpPlay" class="btn btn-sm mp-play" data-i18n-aria="mini.play" data-i18n-title="mini.play">▶</button>
            <input id="mpSeek" class="mp-seek" type="range" min="0" max="1000" value="0" data-i18n-aria="mini.seek" />
            <span id="mpTime" class="mp-time">0:00 / 0:00</span>
            <div class="seg speed-seg" role="group" data-i18n-aria="video.speed" data-i18n-title="video.speed">
              <button data-rate="0.75">0.75×</button>
              <button data-rate="1">1×</button>
              <button data-rate="1.25">1.25×</button>
              <button data-rate="1.5">1.5×</button>
            </div>
          </div>
        </div>
        <div class="subs-options" role="group" data-i18n-aria="subs.options">
          <label class="switch" data-i18n-title="subs.showTrTitle">
            <input type="checkbox" id="trToggle" checked />
            <span class="switch-track"></span>
            <span data-i18n="subs.showTr"></span>
          </label>
          <label class="switch" data-i18n-title="subs.colorsTitle">
            <input type="checkbox" id="colorToggle" checked />
            <span class="switch-track"></span>
            <span data-i18n="subs.colors"></span>
          </label>
          <label class="switch" data-i18n-title="tools.autoTitle">
            <input type="checkbox" id="autoModeToggle" checked />
            <span class="switch-track"></span>
            <span data-i18n="tools.auto"></span>
          </label>
          <p class="opt-hint"><span class="auto-on" data-i18n="tools.autoOn"></span><span class="auto-off" data-i18n="tools.autoOff"></span></p>
        </div>
        <div class="subs-tools">
          <label class="search-field">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
            <input id="subSearch" class="input input-sm" type="search" data-i18n-placeholder="tools.search" data-i18n-aria="tools.search" spellcheck="false" />
          </label>
          <button id="followBtn" class="btn btn-sm hidden" data-i18n="tools.follow" data-i18n-title="tools.followTitle"></button>
          <div id="selBar" class="sel-bar hidden">
            <span id="selInfo"></span>
            <span class="head-spacer"></span>
            <button id="selLoop" class="btn btn-sm"></button>
            <button id="selClear" class="btn btn-sm" data-i18n="sel.clear" data-i18n-title="sel.clearTitle"></button>
            <div class="sel-now"><div id="selDots" class="sel-dots"></div><span id="selNow"></span></div>
          </div>
        </div>
        <div id="trBar" class="tr-bar hidden">
          <span id="trBarText"></span>
          <button id="trBarBtn" class="btn btn-sm hidden"></button>
          <div class="tr-progress hidden"><div id="trProgressBar"></div></div>
        </div>
        <div id="subList" class="sub-list"></div>
      </div>
    </section>
  </main>

  <div id="modal" class="overlay hidden">
    <div class="modal">
      <button id="modalClose" class="modal-x" data-i18n-aria="common.close">×</button>
      <h2 data-i18n="modal.title"></h2>
      <p class="muted" data-i18n="modal.text"></p>
      <input id="urlInput" class="input" type="url" data-i18n-placeholder="modal.placeholder" spellcheck="false" />
      <div id="progress" class="progress hidden">
        <div id="progressTitle" class="progress-title"></div>
        <ol id="progressSteps" class="progress-steps">
          <li data-i18n="step.download"></li>
          <li data-i18n="step.audio"></li>
          <li data-i18n="step.transcribe"></li>
          <li data-i18n="step.sentences"></li>
        </ol>
        <div class="progress-row">
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-aria="step.progress"><div id="progressBar" class="progress-bar"></div></div>
          <strong id="progressPct" class="progress-pct">0%</strong>
        </div>
        <p id="progressText" aria-live="polite"></p>
        <p id="progressDetail" class="progress-detail"></p>
        <p class="muted small" data-i18n="modal.hint"></p>
      </div>
      <div class="modal-actions">
        <button id="cancelBtn" class="btn" data-i18n="modal.cancel"></button>
        <button id="goBtn" class="btn btn-primary" data-i18n="modal.go"></button>
      </div>
    </div>
  </div>

  <div id="settings" class="overlay hidden">
    <div class="modal">
      <button id="settingsClose" class="modal-x" data-i18n-aria="common.close">×</button>
      <h2 data-i18n="settings.title"></h2>
      <p id="settingsIntro" class="muted hidden" data-i18n="settings.firstRun"></p>
      <label class="field">
        <span data-i18n="settings.ui"></span>
        <select id="uiLangSelect" class="select"></select>
      </label>
      <label class="field">
        <span data-i18n="settings.target"></span>
        <select id="targetLangSelect" class="select"></select>
        <small class="muted" data-i18n="settings.targetHint"></small>
      </label>
      <fieldset class="field ai-box">
        <legend data-i18n="settings.ai"></legend>
        <small class="muted" data-i18n="settings.aiHelp"></small>
        <p id="aiStatus" class="ai-status"></p>
        <div class="ai-row">
          <input id="aiKeyInput" class="input input-sm" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="settings.aiKeyPh" />
          <button id="aiKeySave" class="btn btn-sm btn-primary" data-i18n="settings.aiSave"></button>
        </div>
        <div class="ai-row">
          <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" class="small" data-i18n="settings.aiGetKey"></a>
          <span class="head-spacer"></span>
          <button id="aiTest" class="btn btn-sm" data-i18n="settings.aiTest"></button>
          <button id="aiKeyRemove" class="btn btn-sm btn-danger" data-i18n="settings.aiRemove"></button>
        </div>
        <div class="ai-sub">
          <strong class="small" data-i18n="settings.dsTitle"></strong>
          <small class="muted" data-i18n="settings.dsHelp"></small>
          <p id="dsStatus" class="ai-status"></p>
          <div class="ai-row">
            <input id="dsKeyInput" class="input input-sm" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="settings.dsKeyPh" />
            <button id="dsKeySave" class="btn btn-sm btn-primary" data-i18n="settings.aiSave"></button>
          </div>
          <div class="ai-row">
            <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener noreferrer" class="small" data-i18n="settings.dsGetKey"></a>
            <span class="head-spacer"></span>
            <button id="dsTest" class="btn btn-sm" data-i18n="settings.aiTest"></button>
            <button id="dsKeyRemove" class="btn btn-sm btn-danger" data-i18n="settings.aiRemove"></button>
          </div>
          <small class="muted" data-i18n="settings.dsPrivacy"></small>
        </div>
        <label class="ai-row ai-check">
          <input type="checkbox" id="aiWordsToggle" />
          <span class="small" data-i18n="settings.aiWords"></span>
        </label>
        <label class="ai-row">
          <span class="small" data-i18n="settings.aiModel"></span>
          <input id="aiModelInput" class="input input-sm" type="text" spellcheck="false" />
        </label>
        <label class="ai-row">
          <span class="small" data-i18n="settings.level"></span>
          <select id="levelSelect2" class="select select-sm"></select>
        </label>
        <small class="muted" data-i18n="settings.aiPrivacy"></small>
      </fieldset>
      <div class="field">
        <span data-i18n="settings.status"></span>
        <ul class="status-list">
          <li id="stWhisper"></li>
          <li id="stTranslator"></li>
        </ul>
      </div>
      <div class="modal-actions">
        <button id="settingsDone" class="btn btn-primary" data-i18n="settings.done"></button>
      </div>
    </div>
  </div>

  <div id="confirm" class="overlay hidden">
    <div class="modal modal-sm" role="alertdialog" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle" data-i18n="confirm.title"></h2>
      <p id="confirmText" class="muted"></p>
      <div class="modal-actions">
        <button id="confirmNo" class="btn" data-i18n="confirm.no"></button>
        <button id="confirmYes" class="btn btn-danger-solid" data-i18n="confirm.yes"></button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
